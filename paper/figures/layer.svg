<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#444"/>
    </marker>
    <marker id="arrq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1f6fb0"/>
    </marker>
  </defs>

  <!-- ======================= title strip ======================= -->
  <text x="20" y="26" font-size="15" font-weight="bold" fill="#111">ΘetaMem layer</text>
  <text x="20" y="44" font-size="11" fill="#555">one token stream, batch and heads omitted</text>

  <!-- ======================= input ======================= -->
  <rect x="20" y="215" width="86" height="46" rx="6" fill="#eef2f6" stroke="#4a5a68" stroke-width="1.2"/>
  <text x="63" y="234" font-size="12" text-anchor="middle" fill="#111">token</text>
  <text x="63" y="250" font-size="11" text-anchor="middle" fill="#555">h ∈ ℝᵈ</text>

  <!-- ======================= projected-key path ======================= -->
  <text x="130" y="106" font-size="11.5" font-weight="bold" fill="#1f6fb0">projected key and learned branches</text>

  <!-- q/k projection box -->
  <rect x="130" y="118" width="112" height="58" rx="6" fill="#e8f1f9" stroke="#1f6fb0" stroke-width="1.2"/>
  <text x="186" y="140" font-size="12" text-anchor="middle" fill="#111">W_q , W_k</text>
  <text x="186" y="156" font-size="10.5" text-anchor="middle" fill="#555">projected key</text>
  <text x="186" y="169" font-size="10.5" text-anchor="middle" fill="#555">q, k ∈ ℝ³²</text>

  <!-- frontend ops -->
  <rect x="262" y="118" width="150" height="58" rx="6" fill="#f5f8fb" stroke="#7a93a8" stroke-width="1.1"/>
  <text x="337" y="139" font-size="11.5" text-anchor="middle" fill="#111">conv → SiLU →</text>
  <text x="337" y="154" font-size="11.5" text-anchor="middle" fill="#111"><tspan font-weight="bold">RoPE</tspan> → L2</text>
  <text x="337" y="169" font-size="10" text-anchor="middle" fill="#555">positions live here</text>

  <!-- branches -->
  <rect x="432" y="104" width="96" height="38" rx="6" fill="#e8f1f9" stroke="#1f6fb0" stroke-width="1.2"/>
  <text x="480" y="127" font-size="12" text-anchor="middle" fill="#111">W_a k</text>
  <rect x="432" y="152" width="96" height="38" rx="6" fill="#e8f1f9" stroke="#1f6fb0" stroke-width="1.2"/>
  <text x="480" y="175" font-size="12" text-anchor="middle" fill="#111">W_b k</text>
  <text x="480" y="96" font-size="10.5" text-anchor="middle" fill="#1f6fb0">learned branches — the slow memory</text>

  <!-- lift node -->
  <rect x="556" y="118" width="118" height="58" rx="6" fill="#fdf3e7" stroke="#c07820" stroke-width="1.3"/>
  <text x="615" y="139" font-size="12" text-anchor="middle" fill="#111">lift Φ</text>
  <text x="615" y="155" font-size="10.5" text-anchor="middle" fill="#555">⊗ outer / ⊙ product</text>
  <text x="615" y="169" font-size="10.5" text-anchor="middle" fill="#555">signed features</text>

  <!-- projected-key arrows -->
  <line x1="106" y1="230" x2="118" y2="230" stroke="#444" stroke-width="1.2"/>
  <path d="M 118 230 L 118 147 L 128 147" fill="none" stroke="#444" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="242" y1="147" x2="260" y2="147" stroke="#444" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M 412 147 L 422 147 L 422 123 L 430 123" fill="none" stroke="#444" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M 412 147 L 422 147 L 422 171 L 430 171" fill="none" stroke="#444" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M 528 123 L 544 123 L 544 138 L 554 138" fill="none" stroke="#444" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M 528 171 L 544 171 L 544 156 L 554 156" fill="none" stroke="#444" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- ======================= value path ======================= -->
  <rect x="130" y="334" width="112" height="46" rx="6" fill="#f5f8fb" stroke="#7a93a8" stroke-width="1.1"/>
  <text x="186" y="353" font-size="12" text-anchor="middle" fill="#111">W_v</text>
  <text x="186" y="368" font-size="10.5" text-anchor="middle" fill="#555">v ∈ ℝ⁶⁴</text>
  <rect x="262" y="334" width="128" height="46" rx="6" fill="#f5f8fb" stroke="#7a93a8" stroke-width="1.1"/>
  <text x="326" y="362" font-size="11.5" text-anchor="middle" fill="#111">conv → SiLU</text>
  <rect x="410" y="334" width="146" height="46" rx="6" fill="#f5f8fb" stroke="#7a93a8" stroke-width="1.1"/>
  <text x="483" y="352" font-size="11.5" text-anchor="middle" fill="#111">center values − v̄</text>
  <text x="483" y="367" font-size="9.5" text-anchor="middle" fill="#555">running mean, or exact via</text>
  <text x="483" y="377" font-size="9.5" text-anchor="middle" fill="#555">signed key mass [v ; 1]</text>
  <path d="M 106 253 L 112 253 L 112 357 L 128 357" fill="none" stroke="#444" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="242" y1="357" x2="260" y2="357" stroke="#444" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="390" y1="357" x2="408" y2="357" stroke="#444" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- ======================= memory ======================= -->
  <rect x="700" y="104" width="200" height="204" rx="8" fill="#fdf3e7" stroke="#c07820" stroke-width="1.5"/>
  <text x="800" y="128" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">memory state</text>
  <text x="800" y="147" font-size="11" text-anchor="middle" fill="#333">S += Φ(k) ⊗ v</text>
  <text x="800" y="166" font-size="11" text-anchor="middle" fill="#333">read: y = ⟨Φ(q), S⟩</text>
  <line x1="716" y1="180" x2="884" y2="180" stroke="#c07820" stroke-width="0.8" stroke-dasharray="3 3"/>
  <text x="800" y="200" font-size="11" text-anchor="middle" fill="#333">correction states D₁ … D_P (optional)</text>
  <text x="800" y="218" font-size="11" text-anchor="middle" fill="#333">D_p += Φ(k) ⊗ η_p·(v − p̂)</text>
  <text x="800" y="236" font-size="10.5" text-anchor="middle" fill="#555">p̂ = strict-prefix prediction; η_p damped</text>
  <text x="800" y="258" font-size="11" text-anchor="middle" fill="#333">y = Σ_p c_p·⟨Φ(q), state_p⟩ + v̄</text>
  <text x="800" y="278" font-size="10.5" text-anchor="middle" fill="#555">nothing is overwritten; a learned blend</text>
  <text x="800" y="292" font-size="10.5" text-anchor="middle" fill="#555">applies the fixes; the mean returns at read</text>

  <path d="M 674 147 L 698 147" fill="none" stroke="#c07820" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M 556 357 L 690 357 L 690 260 L 698 260" fill="none" stroke="#444" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="612" y="351" font-size="10.5" fill="#555">centered values</text>

  <!-- query dashed reuse -->
  <path d="M 615 118 L 615 60 L 800 60 L 800 102" fill="none" stroke="#1f6fb0" stroke-width="1.1" stroke-dasharray="5 3" marker-end="url(#arrq)"/>
  <text x="800" y="54" font-size="10.5" text-anchor="middle" fill="#1f6fb0">query reuses the same lift (shared weights)</text>

  <!-- ======================= output ======================= -->
  <rect x="700" y="348" width="200" height="52" rx="6" fill="#eef2f6" stroke="#4a5a68" stroke-width="1.2"/>
  <text x="800" y="370" font-size="12" text-anchor="middle" fill="#111">head RMSNorm × SiLU gate</text>
  <text x="800" y="388" font-size="11" text-anchor="middle" fill="#555">→ output projection</text>
  <path d="M 800 308 L 800 346" fill="none" stroke="#444" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="808" y="330" font-size="10" fill="#555">raw read, no denominator</text>
</svg>
